<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173a2b"><title>Локи · анимация ожидания</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3e9;color:#26382e;font:16px/1.6 system-ui,sans-serif}main{max-width:580px;margin:auto;padding:25px 18px}h1{font:34px Georgia,serif;margin:10px 0}p{color:#657163;margin:12px 0 22px}.scene{border-radius:22px;background:radial-gradient(ellipse at 50% 35%,#829568,#244b36 70%);overflow:hidden;position:relative;aspect-ratio:1}.ground{position:absolute;background:#23412e;border-radius:50%;width:120%;height:35%;left:-10%;bottom:-18%}canvas{position:absolute;inset:5%;width:90%;height:90%;filter:drop-shadow(0 12px 8px #09271b55)}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{background:#294c3b;color:#fffdf5;border:1px solid #294c3b;border-radius:12px;padding:12px 17px;font:inherit;cursor:pointer}select{font:inherit;padding:12px;border-radius:12px;background:#fffdf5;color:#294c3b;border:1px solid #294c3b}button.secondary{color:#294c3b;background:#fffdf5}button:focus-visible{outline:3px solid #ac8648;outline-offset:4px}small{display:block;color:#657163;margin-top:15px}.badge{font-size:12px;letter-spacing:1px;color:#748365}#status{min-height:26px}a{color:#294c3b}
</style></head><body><main><span class="badge">ЛЕСНОЕ ЯЙЦО · ПРОБА АНИМАЦИИ</span><h1>Локи оживает</h1><p>Подъём на четыре лапки для детёныша. Все четыре возраста: моргание и мягкие движения во время бодрствования, спокойное дыхание во сне.</p><div class="scene"><div class="ground"></div><canvas id="loki" width="512" height="512" role="img" aria-label="Рыжий лисёнок Локи с изумрудными глазами"></canvas></div><div class="buttons"><button id="play" aria-pressed="true">Пауза</button><label>Возраст <select id="age"><option value="baby">Детёныш</option><option value="teen">Подросток</option><option value="young">Юный</option><option value="adult">Взрослый</option></select></label><button id="sleep" class="secondary" aria-pressed="false">Уложить спать</button><button id="rise" class="secondary">Сделать первые шаги</button><button id="blink" class="secondary">Показать моргание</button></div><small id="status" role="status">Загружаю Локи…</small><small>Это отдельная проба. Сохранение игры здесь не используется.</small><p><a href="./index.html">Вернуться в игру</a></p></main>
<script type="module">
import {createWalkRenderer} from './loki-walk.mjs?v=1.7.0';
import {createLokiRenderer} from './loki-idle.mjs?v=1.7.0';
const canvas=document.getElementById('loki'),play=document.getElementById('play'),status=document.getElementById('status'),age=document.getElementById('age'),sleep=document.getElementById('sleep'),blink=document.getElementById('blink');
const rise=document.getElementById('rise');let riseDraw=null,riseAt=null;
const assets=new Map();
const image=src=>{if(!assets.has(src))assets.set(src,new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>{assets.delete(src);reject(Error('asset'));};im.src=src;}));return assets.get(src);};
let moving=!matchMedia('(prefers-reduced-motion: reduce)').matches,sleeping=false,draw=null,time=0,last=0,frame=0,blinkUntil=0,revision=0;
function labels(){play.textContent=moving?'Пауза':'Продолжить';play.setAttribute('aria-pressed',String(moving));sleep.textContent=sleeping?'Разбудить':'Уложить спать';sleep.setAttribute('aria-pressed',String(sleeping));blink.disabled=sleeping;rise.disabled=sleeping||age.value!=='baby'||!moving;}
async function load(){const own=++revision;draw=null;riseAt=null;status.textContent='Загружаю Локи…';labels();try{const stem='./assets/fox'+(age.value==='baby'?'':'-'+age.value);const [base,closed]=await Promise.all([image(stem+(sleeping?'-sleep':'')+'.png'),sleeping?null:image(stem+'-blink.png')]);if(own!==revision)return;draw=createLokiRenderer({canvas,base,closed,makeCanvas:(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;},age:age.value,sleeping});time=0;draw(0,{moving});status.textContent=sleeping?'Локи дышит во сне.':'Локи спокойно ждёт тебя.';}catch{if(own===revision)status.textContent='Не удалось загрузить картинки. Подключи интернет и открой просмотр снова.';}}
play.onclick=()=>{moving=!moving;labels();if(draw&&!moving)draw(0,{moving:false});};age.onchange=load;sleep.onclick=()=>{sleeping=!sleeping;load();};blink.onclick=()=>{blinkUntil=performance.now()+180;};
rise.onclick=async()=>{const own=revision;try{const [sheet,walkSheet]=await Promise.all([image('./assets/fox-rise.png'),image('./assets/fox-walk.png')]);if(own!==revision||sleeping||!moving)return;riseDraw=createWalkRenderer({canvas,sheet,walkSheet});riseAt=time;}catch{status.textContent='Не удалось загрузить позы Локи.';}};
document.addEventListener('visibilitychange',()=>{last=performance.now();});
function tick(now){const dt=last?Math.min(80,now-last):0;last=now;if(!document.hidden&&draw){if(moving)time+=dt/1000;if(now-frame>1000/24){if(riseAt===null||!riseDraw(time-riseAt)){riseAt=null;draw(time,{moving,forceBlink:now<blinkUntil});}frame=now;}}requestAnimationFrame(tick);}load();requestAnimationFrame(tick);
</script></body></html>
